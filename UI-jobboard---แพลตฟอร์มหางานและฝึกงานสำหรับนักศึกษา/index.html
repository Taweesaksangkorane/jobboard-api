    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FC] text-[#25243A] font-['Prompt',sans-serif] antialiased">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var path = window.location.pathname.replace(/\/+$/, '');
          if (path === '/auth/callback' && window.opener && window.opener !== window) {
            window.opener.postMessage(
              {
                type: 'SUPABASE_OAUTH_CALLBACK',
                search: window.location.search,
                hash: window.location.hash,
              },
              '*'
            );
            window.close();
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
